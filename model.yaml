# 주사위 굴리기 보드 프로모션 — 경량 시맨틱 모델
# AI는 이 파일을 1순위 컨텍스트로 읽고 자연어 질문 → Trino SQL 을 생성한다.
# 컬럼명·메트릭·세그먼트는 여기 정의된 것만 사용한다. 추측·재발명 금지.
#
# 편집 규칙: 이 파일의 구조·필드·값은 model.spec.yaml 의 닫힌 스펙을 따른다.
#   스펙에 없는 키·필드·값을 임의로 쓰지 말 것.
#   부족하면 model.spec.yaml 을 먼저 고친 뒤 여기에 반영한다.

catalog: promotion
schema: dice_board

# --- 한국어 용어 → 영문 매핑 ---------------------------------
# 모호하지 않은 용어는 term+maps_to 만. 모호하면 aliases/note 로 확장.
glossary:
  - term: 참여자
    maps_to: participant

  - term: 참여이력
    aliases: [이력, 액션 로그]
    maps_to: participation_history

  - term: 보드판
    aliases: [보드]
    maps_to: board_id

  - term: 보드 위치
    aliases: [칸, 위치]
    maps_to: current_position
    note: 0-based, 0=시작칸.

  - term: 주사위 수
    aliases: [주사위 개수, 남은 주사위]
    maps_to: dice_remaining
    note: 현재 보유량. 사용 누계는 total_dice_used.

  - term: 주사위 굴리기
    aliases: [굴림, 주사위 던지기, 롤]
    maps_to: "action_type = 'dice_roll'"

  - term: 스테이지
    aliases: [단계]
    maps_to: current_stage
    note: 1-based. 참여자의 현재 진행도면 participant.current_stage,
          특정 액션 시점이면 participation_history.stage.

  - term: 스테이지 클리어
    aliases: [단계 통과, 단계 클리어]
    maps_to: "action_type = 'stage_clear'"

  - term: 상태
    aliases: [활성, 완주, 완료, 이탈, 중단]
    maps_to: status
    note: 활성=active, 완주/완료=completed, 이탈/중단=dropped.
          정확한 정의는 segments(active/completed/dropped) 참조.

# --- 엔티티 (물리 테이블) ------------------------------------
entities:
  participant:
    full_path: promotion.dice_board.participant
    grain: 1 row per (promotion_id, user_id)   # 한 사용자가 한 프로모션에 한 번
    pk: participant_id
    columns:
      participant_id:
        type: bigint
        null: false
        description: 시스템 발급 참여 PK. 내부 식별용 — 사용자 노출 ID 아님.
      promotion_id:
        type: varchar
        null: false
        description: 소속 프로모션 식별자. 예 'dice_2026_spring'.
      user_id:
        type: bigint
        null: false
        pii: true
        description: 실제 사용자 ID. 참여자 수 집계(COUNT DISTINCT)의 기준.
      board_id:
        type: varchar
        null: false
        description: 참여 중인 보드판. 보드마다 칸 수가 다를 수 있음.
      current_stage:
        type: integer
        null: false
        description: 현재 도달 스테이지. 1-based, 값이 클수록 멀리 진행.
      current_position:
        type: integer
        null: false
        description: 현재 보드 위치(칸). 0-based, 0=시작칸. board_id 별 최대값 상이.
      dice_remaining:
        type: integer
        null: false
        description: 현재 보유 주사위 수. 0이면 굴림 불가. dice_charged 로 증가, dice_roll 로 감소.
      total_dice_used:
        type: integer
        null: false
        description: 가입 이래 누적 사용 주사위 합 (순간값 아님).
      total_rolls:
        type: integer
        null: false
        description: 가입 이래 누적 굴림 횟수 (dice_roll 이벤트 수).
      status:
        type: varchar
        null: false
        enum: [active, completed, dropped]
        description: 참여 상태. active=진행중, completed=완주, dropped=이탈.
      joined_at:
        type: timestamp(3) with time zone
        null: false
        description: 최초 참여 시각.
      updated_at:
        type: timestamp(3) with time zone
        null: false
        description: 마지막 상태 변경 시각. 액션이 누적될 때마다 갱신.

  participation_history:
    full_path: promotion.dice_board.participation_history
    grain: 1 row per action event   # append-only
    pk: history_id
    partition_key: event_date
    columns:
      history_id:
        type: bigint
        null: false
        description: 이벤트 PK.
      participant_id:
        type: bigint
        null: false
        fk: participant.participant_id
        description: 액션을 수행한 참여자.
      promotion_id:
        type: varchar
        null: false
        description: 프로모션 ID. 단독 조회·파티션 편의로 중복 보유(denormalized).
      action_type:
        type: varchar
        null: false
        enum: [join, dice_roll, dice_charged, stage_clear, reward_earned, completed, dropped]
        description: >
          이 행의 액션 종류. join=참여, dice_roll=주사위 사용, dice_charged=주사위 충전,
          stage_clear=스테이지 클리어, reward_earned=보상 획득, completed=완주, dropped=이탈.
          값별로 채워지는 컬럼은 action_type_columns 참조.
      stage:
        type: integer
        null: true
        description: 액션 발생 시점의 스테이지. join/dropped 등에서는 NULL.
      dice_count:
        type: integer
        null: true
        description: dice_roll=사용 주사위 수, dice_charged=충전 주사위 수. 그 외 액션은 NULL.
      from_position:
        type: integer
        null: true
        description: 이동 전 보드 위치. dice_roll 에서만 채워짐.
      to_position:
        type: integer
        null: true
        description: 이동 후 보드 위치. dice_roll 에서만 채워짐.
      reward_type:
        type: varchar
        null: true
        enum: [point, coupon, item, dice_extra]
        description: 보상 종류. point=포인트, coupon=쿠폰, item=아이템, dice_extra=추가 주사위. 보상 없으면 NULL.
      reward_value:
        type: bigint
        null: true
        description: 보상 수치. point 면 포인트 양, dice_extra 면 추가 주사위 개수. 보상 없으면 NULL.
      event_date:
        type: date
        null: false
        description: 이벤트 발생일(KST 기준). 파티션 키.
      created_at:
        type: timestamp(3) with time zone
        null: false
        description: 정확한 발생 시각. 정밀 시간 비교용.

# action_type 별 채워지는 컬럼
action_type_columns:
  join:          []
  dice_roll:     [stage, dice_count, from_position, to_position]
  dice_charged:  [stage, dice_count]
  stage_clear:   [stage]                    # reward_* 부수효과 가능
  reward_earned: [stage, reward_type, reward_value]
  completed:     []                         # reward_* 부수효과 가능
  dropped:       []

# --- 조인 ----------------------------------------------------
joins:
  participant__history:
    on: participant.participant_id = participation_history.participant_id
    type: LEFT JOIN
    cardinality: one_to_many   # participant 1 : participation_history N
  forbidden:
    - promotion_id 로 JOIN 금지 (카테시안 폭발)

# --- 디멘션 (group by / filter 대상) -------------------------
dimensions:
  - name: status
    entity: participant
    column: status
    type: categorical
    values: [active, completed, dropped]
  - name: board_id
    entity: participant
    column: board_id
    type: categorical
  - name: current_stage
    entity: participant
    column: current_stage
    type: ordinal
    note: 현재 도달 스테이지 (1-based)
  - name: action_type
    entity: participation_history
    column: action_type
    type: categorical
    values: [join, dice_roll, dice_charged, stage_clear, reward_earned, completed, dropped]
  - name: reward_type
    entity: participation_history
    column: reward_type
    type: categorical
    values: [point, coupon, item, dice_extra]
  - name: event_date
    entity: participation_history
    column: event_date
    type: time
    grain: day
    note: 일자 추이 집계의 기본 시간 축. KST 기준.

# --- 메트릭 (집계 수치). AI는 여기 sql 을 사용/응용한다 ------
metrics:
  - name: total_participants
    label: 총 참여자 수
    entity: participant
    sql: COUNT(DISTINCT user_id)
    sliceable_by: [status, board_id, current_stage]
  - name: active_participants
    label: 활성 참여자 수
    entity: participant
    sql: COUNT(DISTINCT user_id) FILTER (WHERE status = 'active')
    sliceable_by: [board_id, current_stage]
  - name: completion_rate
    label: 완주율
    entity: participant
    sql: CAST(COUNT_IF(status = 'completed') AS DOUBLE) / NULLIF(COUNT(*), 0)
    sliceable_by: [board_id]
  - name: dropout_rate
    label: 이탈율
    entity: participant
    sql: CAST(COUNT_IF(status = 'dropped') AS DOUBLE) / NULLIF(COUNT(*), 0)
    sliceable_by: [board_id]
  - name: avg_reached_stage
    label: 평균 도달 스테이지
    entity: participant
    sql: AVG(current_stage)
    sliceable_by: [board_id, status]
  - name: dice_rolls
    label: 총 주사위 굴림 수
    entity: participation_history
    sql: COUNT(*)
    apply_segment: dice_roll_events
    sliceable_by: [event_date, stage]
  - name: dice_consumed
    label: 사용된 주사위 합
    entity: participation_history
    sql: SUM(dice_count)
    apply_segment: dice_roll_events
    sliceable_by: [event_date, stage]
  - name: avg_rolls_per_user
    label: 사용자당 평균 굴림 수
    entity: participation_history
    sql: CAST(COUNT_IF(action_type = 'dice_roll') AS DOUBLE) / NULLIF(COUNT(DISTINCT participant_id), 0)
    sliceable_by: [event_date]
  - name: stage_clear_count
    label: 스테이지 클리어 건수
    entity: participation_history
    sql: COUNT(*)
    apply_segment: stage_clear_events
    sliceable_by: [event_date, stage]

# --- 세그먼트 (이름 붙인 재사용 필터) ------------------------
segments:
  - name: active
    entity: participant
    filter: status = 'active'
  - name: completed
    entity: participant
    filter: status = 'completed'
  - name: dropped
    entity: participant
    filter: status = 'dropped'
  - name: out_of_dice
    entity: participant
    filter: dice_remaining = 0
    note: 주사위 소진 상태. 충전 유도 타겟.
  - name: dice_roll_events
    entity: participation_history
    filter: action_type = 'dice_roll'
  - name: stage_clear_events
    entity: participation_history
    filter: action_type = 'stage_clear'
  - name: reward_events
    entity: participation_history
    filter: action_type = 'reward_earned'

# --- 오토필터 (명시적으로 덮어쓰지 않는 한 항상 적용) --------
autofilters:
  - entity: participation_history
    filter: event_date >= current_date - INTERVAL '30' DAY
    reason: 파티션 프루닝. 질문에 기간이 없으면 최근 30일로 한정.
    overridable: true   # 질문에 명시적 기간이 있으면 그 기간으로 대체
  - entity: [participant, participation_history]
    filter: promotion_id = :promotion_id
    reason: 프로모션 스코프. 운영 프로모션이 1개면 'dice_2026_spring' 을 기본값으로.
    overridable: true
